<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Login · Kambingan Eatery</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <!-- Google Fonts: Playfair Display (Serif) at Inter (Sans-Serif) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: { 
        extend: { 
          fontFamily: { 
            sans: ['Inter', 'sans-serif'], 
            serif: ['Playfair Display', 'serif'] 
          },
          colors: {
            brand: '#047857', /* Emerald Green */
            brandhover: '#065f46', /* Darker Emerald */
            charcoal: '#333333'
          }
        } 
      }
    }
  </script>

  <style>
    body {
      background-color: #fcfcfc;
      background-image: radial-gradient(#e5e5e5 1px, transparent 1px);
      background-size: 20px 20px; 
    }
  </style>
</head>
<body class="text-charcoal font-sans flex items-center justify-center min-h-screen px-4 selection:bg-brand selection:text-white">

  <!-- LOGIN FORM BOX -->
  <div class="bg-white border border-gray-200 p-8 md:p-10 rounded-3xl shadow-2xl w-full max-w-md relative">
    
    <!-- BACK BUTTON -->
    <a href="index.html" class="absolute top-6 left-6 text-gray-400 hover:text-brand transition flex items-center gap-2 text-sm font-semibold">
      <i class="fas fa-arrow-left"></i> Back to Home
    </a>

    <!-- LOGO & HEADER -->
    <div class="text-center mb-8 mt-6">
      <div class="flex justify-center mb-4">
        <a href="index.html" class="flex items-center gap-2 group">
          <i class="fas fa-goat text-brand text-4xl group-hover:-translate-y-1 transition-transform"></i>
        </a>
      </div>
      <h1 class="text-3xl font-serif font-bold text-charcoal mb-2">Staff Login</h1>
      <p class="text-gray-500 text-sm">Enter your credentials to access the POS</p>
    </div>

    <form action="admin/login.php" method="POST" id="loginForm" class="space-y-5">
      <div>
        <label class="block text-sm font-bold mb-2 text-gray-700">Username</label>
        <input type="text" name="username" id="username" class="w-full px-5 py-3.5 rounded-xl border border-gray-300 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent text-charcoal transition" placeholder="admin">
        <p id="userError" class="text-red-500 text-xs mt-2 hidden">Please enter your username.</p>
      </div>
      <div>
        <label class="block text-sm font-bold mb-2 text-gray-700">Password</label>
        <input type="password" name="password" id="password" class="w-full px-5 py-3.5 rounded-xl border border-gray-300 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent text-charcoal transition" placeholder="••••••••">
        <p id="passError" class="text-red-500 text-xs mt-2 hidden">Please enter your password.</p>
      </div>
      <button type="submit" class="w-full bg-brand text-white font-bold py-4 rounded-xl hover:bg-brandhover transition shadow-lg mt-6 text-lg">
        Login
      </button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
