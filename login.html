<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Login · Kambingan Eatery</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

  <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-green-100 text-[#1b7a3d] rounded-full flex items-center justify-center text-3xl mx-auto mb-4">
        <i class="fas fa-lock"></i>
      </div>
      <h1 class="text-2xl font-black text-gray-800">Staff Login</h1>
      <p class="text-gray-500 text-sm mt-2">Enter your credentials to access the POS</p>
    </div>

    <!-- Form pupunta sa admin/login.php -->
    <form action="admin/login.php" method="POST" id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm font-bold mb-2">Username</label>
        <input type="text" name="username" id="username" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:border-[#1b7a3d]" placeholder="admin">
        <p id="userError" class="text-red-500 text-xs mt-1 hidden">Please enter your username.</p>
      </div>
      <div>
        <label class="block text-sm font-bold mb-2">Password</label>
        <input type="password" name="password" id="password" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:border-[#1b7a3d]" placeholder="••••••••">
        <p id="passError" class="text-red-500 text-xs mt-1 hidden">Please enter your password.</p>
      </div>
      <button type="submit" class="w-full bg-[#1b7a3d] text-white font-bold py-3 rounded-lg hover:bg-[#115327] transition shadow-lg">
        Login
      </button>
    </form>
  </div>
  <script src="script.js"></script>
</body>
</html>
