<!DOCTYPE html>
<html lang="en" class="scroll-smooth dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Login · Kambingan Eatery</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'], montserrat: ['Montserrat', 'sans-serif'] } } }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Montserrat:wght@900&display=swap" rel="stylesheet">
</head>
<!-- Ginawang full screen at naka-center ang laman ng body -->
<body class="m-0 p-0 bg-gray-900 text-gray-100 transition-colors duration-300 font-sans flex items-center justify-center min-h-screen px-4">

  <!-- LOGIN FORM BOX -->
  <div class="bg-gray-800 border border-gray-700 p-8 rounded-2xl shadow-2xl w-full max-w-md relative">
    
    <!-- BACK BUTTON (Nasa taas-kaliwa) -->
    <a href="index.html" class="absolute top-5 left-5 text-gray-400 hover:text-green-400 transition flex items-center gap-2 text-sm font-semibold">
      <i class="fas fa-arrow-left"></i> Back to Home
    </a>

    <div class="text-center mb-8 mt-4">
      <div class="w-16 h-16 bg-green-900 text-green-400 rounded-full flex items-center justify-center text-3xl mx-auto mb-4">
        <i class="fas fa-lock"></i>
      </div>
      <h1 class="text-2xl font-black text-white">Staff Login</h1>
      <p class="text-gray-400 text-sm mt-2">Enter your credentials to access the POS</p>
    </div>

    <form action="admin/login.php" method="POST" id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm font-bold mb-2 text-gray-300">Username</label>
        <input type="text" name="username" id="username" class="w-full px-4 py-3 rounded-lg border border-gray-700 bg-gray-900 focus:outline-none focus:border-green-400 text-white" placeholder="admin">
        <p id="userError" class="text-red-500 text-xs mt-1 hidden">Please enter your username.</p>
      </div>
      <div>
        <label class="block text-sm font-bold mb-2 text-gray-300">Password</label>
        <input type="password" name="password" id="password" class="w-full px-4 py-3 rounded-lg border border-gray-700 bg-gray-900 focus:outline-none focus:border-green-400 text-white" placeholder="••••••••">
        <p id="passError" class="text-red-500 text-xs mt-1 hidden">Please enter your password.</p>
      </div>
      <button type="submit" class="w-full bg-[#1b7a3d] text-white font-bold py-3 rounded-lg hover:bg-[#115327] transition shadow-lg mt-4">
        Login
      </button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
