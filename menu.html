<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kambingan Eatery · Menu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'], montserrat: ['Montserrat', 'sans-serif'] } } }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Montserrat:wght@900&display=swap" rel="stylesheet">
</head>
<body class="bg-white dark:bg-gray-900 text-gray-800 dark:text-gray-100 transition-colors duration-300 font-sans">

  <!-- NAVBAR (Same as index) -->
  <nav class="bg-[#1b7a3d] text-white sticky top-0 z-50 shadow-lg">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-20">
        <a href="index.html" class="flex items-center gap-2">
          <div class="w-12 h-12 bg-white rounded-full flex items-center justify-center text-2xl text-[#1b7a3d]"><i class="fas fa-goat"></i></div>
          <div class="flex flex-col leading-none">
            <span class="font-montserrat font-black text-xl uppercase">Kambingan</span>
            <span class="text-sm italic opacity-90">Eatery</span>
          </div>
        </a>
        <div class="hidden md:flex space-x-6 font-semibold text-sm items-center">
          <a href="index.html" class="hover:text-yellow-300 transition">Home</a>
          <a href="menu.html" class="text-yellow-400 border-b-2 border-yellow-400 pb-1">Menu</a>
          <a href="about.html" class="hover:text-yellow-300 transition">About</a>
          <a href="contact.html" class="hover:text-yellow-300 transition">Contact</a>
          <a href="login.html" class="bg-white text-[#1b7a3d] px-4 py-2 rounded-lg hover:bg-gray-100 transition">Staff Login</a>
        </div>
        <button id="theme-toggle" class="md:hidden text-2xl"><i class="fas fa-moon"></i></button>
      </div>
    </div>
  </nav>

  <!-- MENU SECTION -->
  <main class="max-w-7xl mx-auto px-4 py-16">
    <div class="text-center mb-12">
      <h1 class="text-4xl font-montserrat font-black text-[#1b7a3d] dark:text-green-400 mb-4">Our Menu</h1>
      <p class="text-gray-600 dark:text-gray-400 mb-8">Click any item to view more details.</p>
      
      <!-- Live Search Feature -->
      <div class="max-w-md mx-auto relative">
        <i class="fas fa-search absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
        <input type="text" id="searchInput" placeholder="Search for a dish..." class="w-full pl-12 pr-4 py-3 rounded-full border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 focus:outline-none focus:border-[#1b7a3d] transition">
      </div>
    </div>

    <!-- Menu Grid -->
    <div id="menuGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      <!-- JS will populate this -->
    </div>
  </main>

  <!-- MODAL POP-UP -->
  <div id="menuModal" class="fixed inset-0 bg-black/70 hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white dark:bg-gray-800 rounded-2xl max-w-md w-full p-8 relative shadow-2xl transform scale-95 transition-transform duration-300" id="modalContent">
      <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-500 hover:text-gray-800 dark:hover:text-white text-2xl"><i class="fas fa-times"></i></button>
      <div class="text-center">
        <div class="w-20 h-20 bg-green-100 dark:bg-green-900 rounded-full flex items-center justify-center mx-auto mb-4 text-4xl text-[#1b7a3d] dark:text-green-400">
          <i class="fas fa-utensils"></i>
        </div>
        <h3 id="modalTitle" class="text-2xl font-black mb-2">Dish Name</h3>
        <p id="modalPrice" class="text-2xl font-bold text-[#1b7a3d] dark:text-green-400 mb-4">₱0.00</p>
        <p id="modalDesc" class="text-gray-600 dark:text-gray-300 mb-6">Description here.</p>
        <button onclick="closeModal()" class="bg-[#1b7a3d] text-white font-bold py-2 px-8 rounded-full hover:bg-[#115327] transition">Close</button>
      </div>
    </div>
  </div>

  <footer class="bg-gray-900 text-gray-400 py-8 text-center mt-12">
    <p>&copy; 2025 Kambingan Eatery. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
