<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kambingan Eatery · Home</title>
  
  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Montserrat:wght@900&family=Pacifico&display=swap" rel="stylesheet">
  
  <!-- Tailwind Configuration for Custom Fonts -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            montserrat: ['Montserrat', 'sans-serif'],
            pacifico: ['Pacifico', 'cursive'],
          }
        }
      }
    }
  </script>
  
  <script src="script.js" defer></script>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen font-sans">

  <main class="flex-grow">
    <!-- HERO SECTION -->
    <section class="relative bg-gray-900 text-white py-24 px-6 text-center bg-[url('https://images.unsplash.com/photo-1555939594-58d7cb561ad1?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80')] bg-cover bg-center bg-blend-multiply">
      <div class="max-w-3xl mx-auto relative z-10">
        
        <div class="inline-block bg-[#1b7a3d] text-white font-bold text-sm px-6 py-2 rounded-full border-2 border-white mb-6 shadow-md uppercase tracking-wider">
          <i class="fas fa-leaf mr-2"></i> Authentic & Local
        </div>
        
        <h2 class="text-5xl md:text-6xl font-montserrat font-black uppercase tracking-tight leading-tight mb-6 drop-shadow-[3px_3px_0_#1b7a3d]">
          Kambingan Eatery
        </h2>
        
        <p class="text-lg md:text-xl text-gray-100 mb-10 drop-shadow-md">
          Hearty, slow-cooked goat specialties and Filipino comfort food. Come hungry, leave happy.
        </p>
        
        <div class="flex flex-col sm:flex-row justify-center gap-4">
          <a href="menu.html" class="bg-[#1b7a3d] text-white font-bold py-3 px-8 rounded-full border-2 border-white hover:bg-[#115327] transition-transform hover:-translate-y-1 shadow-lg uppercase tracking-wide">
            <i class="fas fa-book-open mr-2"></i> View Menu
          </a>
          <a href="visit.html" class="bg-white text-[#1b7a3d] font-bold py-3 px-8 rounded-full border-2 border-white hover:bg-gray-100 transition-transform hover:-translate-y-1 shadow-lg uppercase tracking-wide">
            <i class="fas fa-map-marker-alt mr-2"></i> Find Us
          </a>
        </div>
      </div>
    </section>

    <!-- INFO BAR -->
    <div class="max-w-5xl mx-auto px-4 sm:-mt-12 relative z-20">
      <div class="bg-white rounded-xl shadow-lg border border-gray-100 p-6 flex flex-col md:flex-row justify-around gap-6">
        
        <div class="flex items-center gap-4">
          <div class="w-12 h-12 bg-green-50 text-[#1b7a3d] rounded-full flex items-center justify-center text-xl">
            <i class="fas fa-clock"></i>
          </div>
          <div>
            <h4 class="text-xs font-bold text-gray-500 uppercase tracking-wider">Open Daily</h4>
            <p class="font-bold text-gray-900">10:00 AM – 9:00 PM</p>
          </div>
        </div>

        <div class="flex items-center gap-4">
          <div class="w-12 h-12 bg-green-50 text-[#1b7a3d] rounded-full flex items-center justify-center text-xl">
            <i class="fas fa-phone-alt"></i>
          </div>
          <div>
            <h4 class="text-xs font-bold text-gray-500 uppercase tracking-wider">Call Us</h4>
            <p class="font-bold text-gray-900">(02) 1234 5678</p>
          </div>
        </div>

        <div class="flex items-center gap-4">
          <div class="w-12 h-12 bg-green-50 text-[#1b7a3d] rounded-full flex items-center justify-center text-xl">
            <i class="fas fa-map-pin"></i>
          </div>
          <div>
            <h4 class="text-xs font-bold text-gray-500 uppercase tracking-wider">Location</h4>
            <p class="font-bold text-gray-900">Purok 3, Brgy. San Isidro</p>
          </div>
        </div>

      </div>
    </div>
  </main>

</body>
</html>
